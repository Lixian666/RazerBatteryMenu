name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete user problem before proposing an implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints
      description: Include device, privacy, permission, or compatibility constraints.

  - type: checkboxes
    id: scope
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the device support table.
          required: true
        - label: This request does not rely on silently weakening macOS security settings.
          required: true
